<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>5x5-logg</title>
  <meta name="description" content="Träningslogg för 5x5 – logga pass, vilotimer och progress.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5x5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="view-log" class="view" aria-label="Pass"></section>
    <section id="view-history" class="view" aria-label="Historik" hidden></section>
    <section id="view-progress" class="view" aria-label="Progress" hidden></section>
    <section id="view-settings" class="view" aria-label="Inställningar" hidden></section>
  </main>

  <div id="timer" class="timer" hidden role="timer" aria-live="off">
    <div class="timer-bar"><span id="timer-fill"></span></div>
    <div class="timer-row">
      <div class="timer-text">
        <span class="timer-label" id="timer-label">Vila</span>
        <span class="timer-time"><strong id="timer-elapsed">0:00</strong> <span id="timer-target">/ 3:00</span></span>
      </div>
      <button class="btn ghost small" data-act="timer-add">+30 s</button>
      <button class="btn ghost small" data-act="timer-stop" aria-label="Stoppa timer">Stopp</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabs" aria-label="Huvudmeny">
    <button data-tab="log" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M8.5 9v6M15.5 9v6M8.5 12h7"/></svg>
      <span>Pass</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Historik</span>
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Inställningar</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
